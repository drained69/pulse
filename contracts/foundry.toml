[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# QIE's EVM: the QIE team's quickstart pins evm_version = "paris" (no PUSH0).
evm_version = "paris"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
qie = "https://rpc1mainnet.qie.digital"
qie_testnet = "https://rpc1testnet.qie.digital"

[fmt]
line_length = 120
