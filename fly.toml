# Fly.io: `fly launch --no-deploy`, then `fly volumes create data --size 1`, set secrets, `fly deploy`.
app = "qpulse"
primary_region = "ewr"   # Secaucus NJ: QIE's public RPC nodes run on DigitalOcean near New York (~270 ms RTT from elsewhere adds up per call)

[build]

[env]
  PORT = "8787"
  DB_PATH = "/data/qpulse.db"
  QIE_NETWORK = "mainnet"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"   # the indexer must keep running
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
